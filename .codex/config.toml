[mcp_servers.nx-mcp]
command = "npx"
args = ["nx", "mcp"]

[plugins."browser@openai-bundled"]
enabled = true

[mcp_servers.node_repl.env]
# Chrome browser automation is provided through the existing node_repl-backed
# browser plugin path on this machine. Do not add a fake standalone
# chrome-devtools MCP server here.
BROWSER_USE_AVAILABLE_BACKENDS = "chrome,iab"

[features]
plugins = true
multi_agent = true

[[hooks.PostToolUse]]
matcher = "Edit|Write"

[[hooks.PostToolUse.hooks]]
type = "command"
command = 'node "$(git rev-parse --show-toplevel)/.codex/hooks/post-edit-oxfix.mjs"'
timeout = 120
statusMessage = "Running oxfmt and oxlint on changed files"

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = 'node "$(git rev-parse --show-toplevel)/.codex/hooks/stop-validate.mjs"'
timeout = 1800
statusMessage = "Running workspace validation before stop"
